name: Refresh Static Snapshot

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Where this refresh was triggered from"
        required: false
        default: "manual"
      requested_at:
        description: "Request timestamp"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  refresh-snapshot:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate public snapshot from D1
        run: npm run generate:public-data

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/public-data.json; then
            git add data/public-data.json
            git commit -m "Refresh public data snapshot"
            git push
          else
            echo "No snapshot changes to commit."
          fi

      - name: Build Cloudflare bundle
        run: npm run cf:build

      - name: Deploy to Cloudflare
        run: npm run cf:deploy
